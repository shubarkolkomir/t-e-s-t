<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тесты КХЦ</title>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700;900&family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- МОДАЛЬНОЕ ОКНО ПОДТВЕРЖДЕНИЯ -->
  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <div class="modal-icon">⚠️</div>
      <h2>Завершить тест?</h2>
      <p>Вы ответили не на все вопросы. Пропущенные вопросы будут засчитаны как неверные.</p>
      <div class="modal-btns">
        <button class="btn btn-outline" onclick="closeModal()">Отмена</button>
        <button class="btn btn-primary" onclick="finishTest()">Завершить</button>
      </div>
    </div>
  </div>

  <!-- ОСНОВНОЙ LAYOUT -->
  <div class="wrap">
    <header id="main-header" style="display: none;">
      <div onclick="showTestSelection()" style="display:flex; align-items:center; gap:16px; cursor:pointer;">
        <div class="logo-mark">КХЦ</div>
        <div class="header-title">
          <h1>Тесты КХЦ</h1>
          <p id="test-type">Пробное тестирование</p>
        </div>
      </div>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 15px;">
        <div id="user-info" style="font-size: 14px; color: var(--muted);">Пользователь авторизован</div>
        <div onclick="logout()" style="color: var(--wrong); font-size: 13px; cursor: pointer;">Выйти</div>
      </div>
      <div class="timer-badge" id="timer" style="margin-left: 20px;">2:00:00</div>
    </header>

    <div id="app"></div>
  </div>

  <script src="quiz.js"></script>
</body>
</html>
